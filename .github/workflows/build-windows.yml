# ═══════════════════════════════════════════════════════════
# 自动构建 Windows exe
#
# 两种触发方式：
#   1. 推送 tag（推荐）：git tag v0.6.13 && git push origin v0.6.13
#      → 构建完成后自动创建一个 Release，把 exe/zip 挂上去，别人点开就能下载
#   2. 手动：GitHub 网页 → Actions → 构建 Windows 版 → Run workflow
#      → 构建完在本次运行的 Artifacts 里下载（不创建 Release）
#
# 为什么在云端构建而不是你本机：
#   别人拉下来的 exe 是 GitHub 的 windows-latest 机器编的，与你的电脑环境无关，
#   所以「我电脑能跑别人不能跑」这类问题不存在。你本机也不用装 Electron。
# ═══════════════════════════════════════════════════════════

name: 构建 Windows 版

on:
  push:
    tags:
      - "v*"          # 例如 v0.6.13
  workflow_dispatch:  # 允许在网页上手动点按钮触发

# 创建 Release 需要写权限。不写这一行 GITHUB_TOKEN 默认只读，发布步骤会 403。
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    # Electron 的 Chromium 内核（约 100MB）由 @electron/get 在 postinstall 阶段下载，
    # 打包时 electron-builder 也可能再去取发行版。统一指向 npmmirror。
    #
    # ⚠️ 历史教训：这里曾用 npm_config_electron_mirror 把源覆盖回
    # github.com/electron/electron/releases/download/，理由是「GitHub 的构建机直连
    # GitHub 最快」。实测该假设不成立 —— 从 GitHub Releases 拉 100MB 级文件会卡住。
    # （不过 v0.6.5/0.6.17/0.6.18 三次失败的真凶是 package-lock.json 里两处被篡改的
    #  依赖范围，与镜像无关；那次覆盖已在 f57a469 之前移除。）
    #
    # 另外：.npmrc 里的 electron_mirror 已不被新版 npm 识别（会报 Unknown project config），
    # 所以这里用环境变量显式指定 —— 这是官方支持的覆盖方式。
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "tag = $tag / package.json version = $ver"
          if ($tag -ne $ver) {
            Write-Error "tag 与 package.json 的 version 不一致，先把 package.json 的 version 改成 $tag 再重新打 tag。"
            exit 1
          }

      - name: 安装依赖
        run: npm ci

      # app:// 静态伺服层是打包后最容易坏的地方：JS 的 MIME 给错一个字，
      # 窗口能开但游戏是死的（ES 模块被拒），而且不看控制台根本看不出原因。
      # 这个自检是纯 Node 的，不需要 GUI，跑得又快又稳，所以设为硬性门槛。
      # （另有 npm run smoke:electron 会真的起 Electron 加载页面 —— 那个需要桌面会话，
      #   在 CI 上有偶发风险，没有放进流程里。）
      - name: 自检 app:// 伺服层
        run: npm run smoke

      # 打包失败时的排查依据：确认 Electron 的二进制到底有没有下下来。
      # 背景：npm 上的 electron 包本体只有约 1MB，真正的 Chromium 内核（约 100MB）
      # 由 @electron/get 在 postinstall 阶段另行下载。若这一步没跑成，
      # electron-builder 会因为找不到发行版而在几秒内直接退出。
      - name: 诊断 Electron 安装状态
        shell: pwsh
        run: |
          Write-Host "node: $(node --version)   npm: $(npm --version)"
          Write-Host "npm_config_electron_mirror = '$env:npm_config_electron_mirror'"
          Write-Host "ELECTRON_MIRROR = '$env:ELECTRON_MIRROR'"
          Write-Host "--- node_modules\electron 内容 ---"
          if (Test-Path node_modules\electron) {
            Get-ChildItem node_modules\electron -Force | Select-Object Name, Length | Format-Table -AutoSize
            Write-Host "electron dist 目录存在: $(Test-Path node_modules\electron\dist)"
            Write-Host "electron.exe 存在:      $(Test-Path node_modules\electron\dist\electron.exe)"
            if (Test-Path node_modules\electron\path.txt) {
              Write-Host "path.txt: $(Get-Content node_modules\electron\path.txt -Raw)"
            }
          } else {
            Write-Host "!! node_modules\electron 不存在 —— 依赖没装上"
          }
          Write-Host "--- electron 版本 ---"
          node -e "try{console.log('electron 包:', require('electron/package.json').version)}catch(e){console.log('读不到 electron/package.json:', e.message)}"
          Write-Host "--- electron-builder 版本 ---"
          # 这一项失败不让整个步骤挂掉：诊断步骤的职责是"把信息打出来"，
          # 真正的失败应该由后面的「打包 exe」暴露，免得被这里掩盖。
          npx --no-install electron-builder --version
          if ($LASTEXITCODE -ne 0) { Write-Host "!! electron-builder 不可用（退出码 $LASTEXITCODE）" }
          exit 0

      - name: 打包 exe
        run: npm run dist

      - name: 列出产物（便于排查）
        shell: pwsh
        run: Get-ChildItem release | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: KongxiangIncremental-windows-x64
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.exe
            release/*.zip
          generate_release_notes: true
          draft: false
